name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test SegakTracker.Tests/SegakTracker.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  android:
    name: Build Android app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Pin .NET 8 SDK
        # The runner's default SDK is newer and would pull a different MAUI workload.
        run: dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^8\.' | tail -1 | cut -d' ' -f1)" --roll-forward latestPatch
      - name: Install MAUI Android workload
        run: dotnet --version && dotnet workload install maui-android
      - name: Build
        # On Linux the project only targets Android; iOS/Mac Catalyst need macOS.
        run: >
          dotnet build "SEGAK Tracker/SEGAK Tracker.csproj"
          --configuration Release
          -f net8.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AndroidPackageFormat=apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: segak-tracker-android
          path: "SEGAK Tracker/bin/Release/net8.0-android/*-Signed.apk"
          if-no-files-found: warn
